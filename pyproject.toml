[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-lab"
version = "0.1.0"
description = "A classroom lab for comparing agent collaboration structures."
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
agent-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
lab = ["report.html"]
