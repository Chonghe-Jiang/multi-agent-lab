name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m lab demo --out runs/ci-demo
      - run: python -m lab suite --backend demo --out runs/ci-suite
      - run: python -m lab suite --resume --out runs/ci-suite
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-reports-python-${{ matrix.python }}
          path: |
            runs/ci-demo/
            runs/ci-suite/
